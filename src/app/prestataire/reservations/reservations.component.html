<div class="table-container">
  <h3 class="title">📅 Vos Réservations</h3>

  <table mat-table [dataSource]="reservations" class="styled-table mat-elevation-z8">


    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let r"> {{ r.date  | date:'mediumDate' }} </td>
    </ng-container>

    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef> Client </th>
      <td mat-cell *matCellDef="let r"> {{ r.userName }} </td>
    </ng-container>

    <ng-container matColumnDef="adresse">
      <th mat-header-cell *matHeaderCellDef> Adresse </th>
      <td mat-cell *matCellDef="let r"> {{ r.adresse }} </td>
    </ng-container>

    <ng-container matColumnDef="reservationDescription">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let r"> {{ r.reservationDescription }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Statut </th>
      <td mat-cell *matCellDef="let r"> 
        <span [ngClass]="{
          'badge-success': r.orderStatus === 'ACCEPTER',
          'badge-warning': r.orderStatus === 'ENATTENTE',
          'badge-danger': r.orderStatus === 'ANNULLEE'
        }">
          {{ r.orderStatus }}
        </span>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
