<div class="container mt-5 p-4 bg-white rounded shadow">
  <h2 class="text-center mb-4 text-primary">
    📋 Toutes les réservations  tansik events
  </h2>

  <div class="search-field-wrapper">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>🔍 Rechercher une réservation par utilisateur</mat-label>
      <input matInput [(ngModel)]="searchEventsUserName" (input)="searchReservationsByUserName()" placeholder="Ex: bessem">
    </mat-form-field>
  </div>

  <div class="table-responsive">
    <table mat-table [dataSource]="reservations" class="mat-elevation-z8 table-section">

      <!-- Tracking ID -->
      <ng-container matColumnDef="trackingId">
        <th mat-header-cell *matHeaderCellDef>Télephone</th>
        <td mat-cell *matCellDef="let r">{{ r.telephone }}</td>
      </ng-container>

      <!-- Service -->
      <ng-container matColumnDef="nomService">
        <th mat-header-cell *matHeaderCellDef>Service</th>
        <td mat-cell *matCellDef="let r">{{ r.nomService }}</td>
      </ng-container>

      <!-- Prix -->
      <ng-container matColumnDef="prix">
        <th mat-header-cell *matHeaderCellDef>Prix (DT)</th>
        <td mat-cell *matCellDef="let r">{{ r.prix }}</td>
      </ng-container>

      <!-- Client -->
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>Client</th>
        <td mat-cell *matCellDef="let r">{{ r.userName }}</td>
      </ng-container>

      <!-- Adresse -->
      <ng-container matColumnDef="adresse">
        <th mat-header-cell *matHeaderCellDef>Adresse</th>
        <td mat-cell *matCellDef="let r">{{ r.adresse }}</td>
      </ng-container>

      <!-- Date -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.date | date: 'dd/MM/yyyy à HH:mm' }}</td>
      </ng-container>

      <!-- Statut -->
      <ng-container matColumnDef="orderStatus">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let r">
          <span [ngClass]="{
            'badge-success': r.orderStatus === 'ACCEPTER',
            'badge-warning': r.orderStatus === 'ENATTENTE',
            'badge-danger': r.orderStatus === 'ANNULLEE'
          }">
            {{ r.orderStatus }}
          </span>
        </td>
      </ng-container>

      <!-- Action -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <div class="actions-btn">
            <button mat-stroked-button color="primary" (click)="changeStatus(r.id, 'ACCEPTEE')">✅ Accepter</button>
            <button mat-stroked-button color="warn" (click)="changeStatus(r.id, 'ANNULLEE')">❌ Annuler</button>
          </div>
        </td>
      </ng-container>

      <!-- Header / Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</div>
