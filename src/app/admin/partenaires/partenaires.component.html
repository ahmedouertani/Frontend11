<div class="container">
  <h2 class="page-title">Liste des prestataires</h2>

  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card *ngIf="!isLoading" class="mat-card-wrapper">
    <mat-card-content>

      <div class="table-responsive-wrapper">
        <table mat-table [dataSource]="prestataires" class="mat-elevation-z8 full-width-table">

          <!-- Colonne Nom -->
          <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let element">{{element.nom}}</td>
          </ng-container>

          <!-- Colonne Email -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let element">{{element.email}}</td>
          </ng-container>

          <!-- Colonne Matricule Fiscale -->
          <ng-container matColumnDef="matriculefiscale">
            <th mat-header-cell *matHeaderCellDef>Matricule Fiscale</th>
            <td mat-cell *matCellDef="let element">{{element.matriculefiscale}}</td>
          </ng-container>

          <!-- Colonne Téléphone -->
          <ng-container matColumnDef="telephone">
            <th mat-header-cell *matHeaderCellDef>Numéro Téléphone</th>
            <td mat-cell *matCellDef="let element">{{element.telephone}}</td>
          </ng-container>

          <ng-container matColumnDef="compteStatus">
            <th mat-header-cell *matHeaderCellDef>Compte Status</th>
            <td mat-cell *matCellDef="let element">{{ element.compteStatus || 'non défini' }}</td>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <div class="action-buttons">
                <button mat-stroked-button color="primary" [routerLink]="['/admin/modifiercomptes', element.id]">Modifier</button>

                <!-- Bouton Bloquer -->
                <button mat-stroked-button color="warn" *ngIf="element.compteStatus === 'DEBLOQUE'||'non défini'" (click)="bloquerClient(element.id)">
                  Bloquer
                </button>
                
                <button mat-stroked-button color="primary" *ngIf="element.compteStatus === 'BLOQUE'" (click)="debloquerClient(element.id)">
                  Débloquer
                </button>
                
              </div>
            </td>
          </ng-container>


          <!-- Rendu des lignes -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
      </div>

      <div *ngIf="prestataires.length === 0" class="no-data">
        Aucun prestataire trouvé
      </div>

      <div class="add-button-container">
        <button mat-flat-button color="primary" (click)="navigateToAdd()">
          <mat-icon>add</mat-icon> Créer un compte partenaire
        </button>
      </div>

    </mat-card-content>
  </mat-card>
</div>
