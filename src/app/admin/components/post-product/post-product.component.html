<div class="main-content">
  <div class="add-service-container">


    <h2 class="page-title">Ajouter un Service</h2>

    <form [formGroup]="productForm" (ngSubmit)="addProduct()" class="product-form">

      <!-- Choix Tansik Prod / Events -->
      <mat-card class="form-section">
        <mat-card-header>
          <mat-card-title>Type de Service</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-radio-group formControlName="afficherDans" class="radio-group">
            <mat-radio-button value="prod" class="radio-button">
              <mat-icon>storefront</mat-icon> Tansik Prod
            </mat-radio-button>
            <mat-radio-button value="events" class="radio-button">
              <mat-icon>event</mat-icon> Tansik Events
            </mat-radio-button>
          </mat-radio-group>
        </mat-card-content>
      </mat-card>

      <!-- Upload image -->
      <mat-card class="form-section">
        <mat-card-header>
          <mat-card-title>Image du Service</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <label class="file-upload-label">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" #fileInput hidden>
            <mat-icon>cloud_upload</mat-icon>
            <span>{{ file ? file.name : 'Choisir une image' }}</span>
            <button mat-raised-button color="primary" type="button" (click)="fileInput.click()">
              Parcourir
            </button>
          </label>

          <div *ngIf="imagePreview" class="image-preview-container">
            <img [src]="imagePreview" alt="Aperçu" class="image-preview">
            <button mat-icon-button class="clear-image" (click)="file = null; imagePreview = null">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </mat-card-content>
      </mat-card>

      <!-- Informations de base -->
      <mat-card class="form-section">
        <mat-card-header>
          <mat-card-title>Informations de Base</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Nom du Service</mat-label>
            <input matInput formControlName="name" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="3" required></textarea>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Catégorie</mat-label>
            <mat-select formControlName="categoryId" required>
              <mat-option *ngFor="let category of filteredCategories" [value]="category.id">
                {{ category.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          


          

        </mat-card-content>
      </mat-card>

      <!-- Si service Tansik Events -->
      <mat-card *ngIf="isEventsSelected" class="form-section">
        <mat-card-header>
          <mat-card-title>Détails pour Tansik Events</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Prix (DT)</mat-label>
            <input matInput type="number" formControlName="prix" min="0">
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Prestataire</mat-label>
            <mat-select formControlName="prestataireId" required>
              <mat-option *ngFor="let p of prestataires" [value]="p.id">
                {{ p.nom }} ({{ p.email }})
              </mat-option>
            </mat-select>
          </mat-form-field>


        </mat-card-content>
      </mat-card>

      <!-- Actions -->
      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="navigateTo('/admin/dashboard')">
          Annuler
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid || isSubmitting">
          <mat-icon>save</mat-icon>
          {{ isSubmitting ? 'Envoi en cours...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
