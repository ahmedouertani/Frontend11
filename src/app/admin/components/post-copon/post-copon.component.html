<div class="main-content">
  <div class="add-copon-container">
    <h2>Ajouter un Coupon</h2>

    <form [formGroup]="coponForm" (ngSubmit)="addCopon()" enctype="multipart/form-data" class="add-copon-form">

      <!-- Nom -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="name" placeholder="Nom du coupon" />
        <mat-error *ngIf="coponForm.get('name')?.hasError('required')">Champ requis</mat-error>
      </mat-form-field>

      <!-- Code -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" placeholder="Code promo" />
        <mat-error *ngIf="coponForm.get('code')?.hasError('required')">Champ requis</mat-error>
      </mat-form-field>

      <!-- Réduction -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Réduction (%)</mat-label>
        <input matInput type="number" formControlName="discount" placeholder="Ex: 10" />
        <mat-error *ngIf="coponForm.get('discount')?.hasError('required')">Champ requis</mat-error>
      </mat-form-field>

      <!-- Date Expiration -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date d'expiration</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="expirationDate" placeholder="Choisir une date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="coponForm.get('expirationDate')?.hasError('required')">Champ requis</mat-error>
      </mat-form-field>

      <!-- Description -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="2" placeholder="Description du coupon"></textarea>
      </mat-form-field>

      <!-- Montant Reservation -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Montant Réservation Exigée</mat-label>
        <input matInput type="number" formControlName="montantReservationExiges" placeholder="Montant minimum requis" />
      </mat-form-field>

      <!-- Upload Image -->
      <div class="file-upload">
        <label for="img">Image (optionnelle)</label>
        <input id="img" type="file" (change)="onFileSelected($event)" accept="image/*" class="file-input" />
      </div>

      <!-- Bouton Submit -->
      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="coponForm.invalid">
          Ajouter
        </button>
      </div>

    </form>
  </div>
</div>
