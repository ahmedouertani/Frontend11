<div class="container mt-5 p-4 bg-white rounded shadow">
  <h2 class="mb-4 text-center text-primary">
    📋 Liste des rendez-vous réservés
  </h2>

  <!-- Partie responsive -->
  <div class="table-responsive">
    <table *ngIf="!isLoading && rendezvousList.length > 0" class="table table-striped table-hover mt-4">
      <thead class="thead-dark">
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Date</th>
          <th>Heure</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rdv of rendezvousList">
          <td>{{ rdv.nom }}</td>
          <td>{{ rdv.email }}</td>
          <td>{{ rdv.telephone }}</td>
          <td>{{ rdv.date }}</td>
          <td>{{ rdv.heure }}</td>
          <td>
            <span [ngClass]="{
              'text-warning': rdv.status === 'ENATTENTE',
              'text-success': rdv.status === 'CONFIRME',
              'text-danger': rdv.status === 'ANNULLEE'
            }">
              {{ rdv.status }}
            </span>
          </td>
          <td>
            <div class="actions-btn">
              <button *ngIf="rdv.status === 'ENATTENTE'" mat-stroked-button color="primary" (click)="accepterRendezVous(rdv.id)">
                ✅ Accepter
              </button>
              <button *ngIf="rdv.status !== 'ANNULLEE'" mat-stroked-button color="warn" (click)="annulerRendezVous(rdv.id)">
                ❌ Annuler
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!isLoading && rendezvousList.length === 0" class="alert alert-info mt-4">
    Aucun rendez-vous trouvé.
  </div>
</div>
